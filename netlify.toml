# Netlify config for Aliyah's Flashcards.
# The PWA is served from the repo root (index.html + config.js/main.js/sw.js +
# design/ + assets/, loading src/ + answer-utils.js + vocabulary.js). The old
# standalone app was removed and the app promoted to the root (2026-11-13).
# Serverless functions (the Claude-vision OCR importer) live in netlify/functions.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Migration: the app used to live at /app/ during testing. Forward any lingering
# /app/… bookmark or home-screen install to the same path at the root.
[[redirects]]
  from = "/app/*"
  to = "/:splat"
  status = 301
