<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aliyah's Flashcards — dev shell</title>
<style>
  /* DELIBERATELY NEUTRAL / UNSTYLED — this is the functional shell.
     The real visual system comes from Claude Design and gets applied over this. */
  :root { color-scheme: light dark; font: 16px/1.45 system-ui, -apple-system, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; max-width: 640px; margin-inline: auto; }
  .devbar { font-size: 12px; opacity: .6; border: 1px dashed currentColor; padding: 4px 8px;
            border-radius: 6px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .screen { display: none; }
  .screen.active { display: block; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin: 0 0 12px; }
  label.lesson { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; }
  .count { opacity: .6; font-size: 13px; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 1px solid #8886;
           background: #8881; cursor: pointer; }
  button.primary { border-color: transparent; background: #2563eb; color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .prompt { font-size: clamp(30px, 9vw, 52px); font-weight: 800; margin: 24px 0 8px; word-break: break-word; }
  .sub { opacity: .6; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  input[type=text] { font: inherit; width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #8886; }
  .feedback { min-height: 48px; margin: 12px 0; font-weight: 700; }
  .ok { color: #16a34a; } .no { color: #dc2626; }
  .answer { font-weight: 800; }
  .why { font-weight: 400; opacity: .6; font-size: 13px; }
  .done { font-size: 18px; margin: 32px 0; }
</style>
</head>
<body>
  <div class="devbar">DEV SHELL · neutral styling on purpose · local IndexedDB · demo user (no sign-in yet)</div>

  <!-- LIBRARY -->
  <section id="screen-library" class="screen active">
    <h1>Library</h1>
    <p class="count" id="lib-status">Loading…</p>
    <fieldset id="lesson-list"></fieldset>
    <div class="row">
      <button class="primary" id="btn-study">Study selected</button>
      <button id="btn-study-all">Study all</button>
      <button id="btn-reset">Reset progress</button>
    </div>
  </section>

  <!-- STUDY -->
  <section id="screen-study" class="screen">
    <div class="row">
      <button id="btn-back">‹ Library</button>
      <span class="count" id="study-progress"></span>
    </div>
    <div id="study-body">
      <div class="sub" id="study-cat"></div>
      <div class="prompt" id="study-prompt"></div>
      <form id="answer-form">
        <input type="text" id="answer-input" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="type the English translation">
        <div class="row"><button class="primary" type="submit" id="btn-submit">Check</button></div>
      </form>
      <div class="feedback" id="feedback" aria-live="polite"></div>
      <div class="row" id="grade-row" style="display:none">
        <button data-grade="again">Again</button>
        <button data-grade="hard">Hard</button>
        <button data-grade="good" class="primary">Good</button>
        <button data-grade="easy">Easy</button>
      </div>
    </div>
    <div class="done" id="study-done" style="display:none">Session complete — nothing due right now. 🎉</div>
  </section>

  <!-- data layer (UMD globals), dependency order -->
  <script src="../answer-utils.js" defer></script>
  <script src="../vocabulary.js" defer></script>
  <script src="../src/model/model.js" defer></script>
  <script src="../src/srs/scheduler.js" defer></script>
  <script src="../src/match/matcher.js" defer></script>
  <script src="../src/store/store.js" defer></script>
  <script src="../src/store/idb-adapter.js" defer></script>
  <script src="../src/io/export-import.js" defer></script>
  <script src="../src/seed/seed-data.js" defer></script>
  <script src="../src/seed/seed.js" defer></script>

  <script defer>
  document.addEventListener("DOMContentLoaded", async () => {
    const model = self.SpanishFlashcardsModel;
    const matcher = self.SpanishFlashcardsMatcher;
    const { createStore } = self.SpanishFlashcardsStore;
    const { createIdbAdapter } = self.SpanishFlashcardsIdbAdapter;
    const { seedUser } = self.SpanishFlashcardsSeed;

    const DEMO_ID = "demo-local-user";
    const store = createStore(createIdbAdapter({ name: "aliyah-flashcards-dev" }));

    // ensure demo user + seed (idempotent)
    let user = await store.getUser(DEMO_ID);
    if (!user) {
      user = model.createUser({ email: "demo@local", displayName: "Demo", role: "user" }, Date.now());
      user.id = DEMO_ID;
      await store.putUser(user);
    }
    await seedUser(store, DEMO_ID, Date.now());

    const ctx = store.studyContext(user);
    let lessons = await store.listLessons(DEMO_ID);

    // ---- library screen ----
    const listEl = document.getElementById("lesson-list");
    const statusEl = document.getElementById("lib-status");
    function renderLibrary() {
      statusEl.textContent = `${lessons.length} lessons`;
      listEl.innerHTML = "";
      for (const l of lessons) {
        const row = document.createElement("label");
        row.className = "lesson";
        row.innerHTML =
          `<input type="checkbox" value="${l.id}"> <span>${l.name}</span>` +
          ` <span class="count">${l.cardIds.length} cards</span>`;
        listEl.appendChild(row);
      }
    }
    renderLibrary();

    const show = (id) => {
      document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    };

    // ---- study screen ----
    let queue = [], idx = 0;
    const promptEl = document.getElementById("study-prompt");
    const catEl = document.getElementById("study-cat");
    const inputEl = document.getElementById("answer-input");
    const fbEl = document.getElementById("feedback");
    const gradeRow = document.getElementById("grade-row");
    const progEl = document.getElementById("study-progress");
    const bodyEl = document.getElementById("study-body");
    const doneEl = document.getElementById("study-done");
    let current = null, answered = false;

    async function startSession(selected) {
      queue = await store.selectDue(ctx, selected, Date.now(), 20);
      idx = 0;
      show("screen-study");
      if (!queue.length) { bodyEl.style.display = "none"; doneEl.style.display = "block"; return; }
      bodyEl.style.display = "block"; doneEl.style.display = "none";
      renderCard();
    }

    function renderCard() {
      current = queue[idx];
      answered = false;
      catEl.textContent = current.category || "";
      promptEl.textContent = current.front;
      inputEl.value = ""; inputEl.disabled = false;
      fbEl.textContent = ""; fbEl.className = "feedback";
      gradeRow.style.display = "none";
      progEl.textContent = `${idx + 1} / ${queue.length}`;
      inputEl.focus();
    }

    document.getElementById("answer-form").addEventListener("submit", (e) => {
      e.preventDefault();
      if (answered) return;
      const res = matcher.isCorrect(inputEl.value, current);
      answered = true;
      inputEl.disabled = true;
      if (res.correct) {
        fbEl.className = "feedback ok";
        fbEl.innerHTML = `✓ Correct <span class="why">(${res.why})</span>`;
      } else {
        fbEl.className = "feedback no";
        fbEl.innerHTML = `✗ Not quite — <span class="answer">${current.back}</span>`;
      }
      // preselect a sensible grade but let the user override (shows SRS in action)
      gradeRow.style.display = "flex";
    });

    gradeRow.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-grade]");
      if (!btn || !answered) return;
      await store.review(ctx, current, btn.dataset.grade, "type", Date.now(), inputEl.value);
      idx++;
      if (idx >= queue.length) { bodyEl.style.display = "none"; doneEl.style.display = "block"; }
      else renderCard();
    });

    document.getElementById("btn-study").addEventListener("click", () => {
      const ids = [...listEl.querySelectorAll("input:checked")].map((c) => c.value);
      const sel = lessons.filter((l) => ids.includes(l.id));
      if (!sel.length) { statusEl.textContent = "Pick at least one lesson first."; return; }
      startSession(sel);
    });
    document.getElementById("btn-study-all").addEventListener("click", () => startSession(lessons));
    document.getElementById("btn-back").addEventListener("click", () => show("screen-library"));
    document.getElementById("btn-reset").addEventListener("click", async () => {
      await store.adapter.clear();
      location.reload();
    });

    window.__shell = { store, user, ctx }; // for console poking
  });
  </script>
</body>
</html>
